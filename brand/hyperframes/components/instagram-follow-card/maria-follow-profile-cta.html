<!doctype html>
<html lang="es">
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Source Serif 4";
          src: url("assets/maria-follow-card/fonts/source-serif-4-600.ttf") format("truetype");
          font-weight: 600;
        }
        @font-face {
          font-family: "Work Sans";
          src: url("assets/maria-follow-card/fonts/work-sans-700.ttf") format("truetype");
          font-weight: 700;
        }
        @font-face {
          font-family: "Work Sans";
          src: url("assets/maria-follow-card/fonts/work-sans-800.ttf") format("truetype");
          font-weight: 800;
        }
        @font-face {
          font-family: "IBM Plex Mono";
          src: url("assets/maria-follow-card/fonts/ibm-plex-mono-600.ttf") format("truetype");
          font-weight: 600;
        }

        #maria-follow-profile-cta-root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          font-family: "Work Sans", sans-serif;
        }

        .maria-follow-gradient {
          position: absolute;
          inset: 0;
          background: linear-gradient(
            180deg,
            rgba(5, 8, 10, 0) 48%,
            rgba(5, 8, 10, 0.16) 61%,
            rgba(5, 8, 10, 0.64) 84%,
            rgba(5, 8, 10, 0.82) 100%
          );
        }

        .maria-follow-card {
          position: absolute;
          left: 56px;
          right: 56px;
          bottom: 334px;
          height: 306px;
          display: grid;
          grid-template-columns: 166px minmax(0, 1fr) 254px;
          gap: 26px;
          align-items: center;
          box-sizing: border-box;
          padding: 30px 38px;
          border: 2px solid rgba(150, 191, 212, 0.9);
          border-radius: 38px;
          background:
            radial-gradient(circle at 94% 18%, rgba(201, 225, 234, 0.95), transparent 36%),
            #fdfbf8;
          box-shadow: 0 22px 58px rgba(0, 0, 0, 0.34);
        }

        .maria-follow-card::before {
          position: absolute;
          top: 27px;
          left: 38px;
          width: 152px;
          height: 5px;
          border-radius: 999px;
          background: #96bfd4;
          content: "";
        }

        .maria-follow-avatar {
          width: 154px;
          height: 154px;
          border: 5px solid #fdfbf8;
          border-radius: 50%;
          background-image: url("assets/maria-follow-card/maria-profile-reference.png");
          background-position: -110px -27px;
          background-repeat: no-repeat;
          background-size: 706px 216px;
          box-shadow: 0 0 0 2px #96bfd4;
        }

        .maria-follow-copy {
          min-width: 0;
          padding-top: 20px;
        }

        .maria-follow-handle {
          margin: 0 0 10px;
          color: #4a7691;
          font-family: "IBM Plex Mono", monospace;
          font-size: 22px;
          font-weight: 600;
          letter-spacing: 0.035em;
        }

        .maria-follow-name {
          margin: 0;
          color: #241e1b;
          font-family: "Source Serif 4", serif;
          font-size: 51px;
          font-weight: 600;
          line-height: 0.98;
        }

        .maria-follow-rule {
          width: 120px;
          height: 3px;
          margin-top: 18px;
          border-radius: 999px;
          background: #5c1a2c;
        }

        .maria-follow-action {
          position: relative;
          display: grid;
          min-height: 162px;
          place-items: center;
        }

        .maria-follow-button {
          position: relative;
          z-index: 2;
          display: grid;
          width: 228px;
          height: 96px;
          place-items: center;
          overflow: hidden;
          border-radius: 999px;
          background: #5c1a2c;
          color: #ffffff;
          font-size: 29px;
          font-weight: 800;
          letter-spacing: 0.025em;
        }

        .maria-follow-label {
          position: absolute;
          inset: 0;
          display: grid;
          place-items: center;
        }

        .maria-follow-label--following {
          opacity: 0;
        }

        .maria-follow-cursor {
          position: absolute;
          right: -3px;
          bottom: -2px;
          z-index: 4;
          width: 76px;
          height: 90px;
          filter: drop-shadow(0 5px 0 rgba(36, 30, 27, 0.16));
        }

        .maria-follow-click-ring {
          position: absolute;
          right: 12px;
          bottom: 13px;
          z-index: 1;
          width: 88px;
          height: 88px;
          border: 4px solid #96bfd4;
          border-radius: 50%;
          opacity: 0;
        }
      </style>

      <div
        id="maria-follow-profile-cta-root"
        data-composition-id="maria-follow-profile-cta"
        data-width="1080"
        data-height="1920"
        data-duration="12"
      >
        <div class="maria-follow-gradient"></div>
        <div class="maria-follow-card">
          <div class="maria-follow-avatar" aria-label="Perfil de María Bejarano"></div>
          <div class="maria-follow-copy">
            <p class="maria-follow-handle">by.mariabejarano</p>
            <p class="maria-follow-name">MARÍA BEJARANO</p>
            <div class="maria-follow-rule"></div>
          </div>
          <div class="maria-follow-action">
            <div class="maria-follow-click-ring"></div>
            <div class="maria-follow-button">
              <span class="maria-follow-label maria-follow-label--follow" data-layout-allow-overflow data-layout-allow-overlap>SÍGUEME</span>
              <span class="maria-follow-label maria-follow-label--following" data-layout-allow-overflow data-layout-allow-overlap>SIGUIENDO</span>
            </div>
            <svg class="maria-follow-cursor" viewBox="0 0 76 90" aria-hidden="true">
              <path d="M8 5 66 53 43 57 56 82 42 88 29 61 14 78Z" fill="#FDFBF8" stroke="#241E1B" stroke-linejoin="round" stroke-width="5" />
            </svg>
          </div>
        </div>
      </div>

      <script>
        (() => {
          const root = document.getElementById("maria-follow-profile-cta-root");
          const gradient = root.querySelector(".maria-follow-gradient");
          const card = root.querySelector(".maria-follow-card");
          const avatar = root.querySelector(".maria-follow-avatar");
          const handle = root.querySelector(".maria-follow-handle");
          const name = root.querySelector(".maria-follow-name");
          const rule = root.querySelector(".maria-follow-rule");
          const button = root.querySelector(".maria-follow-button");
          const followLabel = root.querySelector(".maria-follow-label--follow");
          const followingLabel = root.querySelector(".maria-follow-label--following");
          const cursor = root.querySelector(".maria-follow-cursor");
          const clickRing = root.querySelector(".maria-follow-click-ring");

          const tl = gsap.timeline({ paused: true });
          tl.fromTo(gradient, { opacity: 0 }, { opacity: 1, duration: 0.34, ease: "power1.out" }, 0)
            .fromTo(card, { y: 76, opacity: 0 }, { y: 0, opacity: 1, duration: 0.48, ease: "power3.out" }, 0.18)
            .fromTo(avatar, { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.3)
            .fromTo(handle, { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.26, ease: "power2.out" }, 0.4)
            .fromTo(name, { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.34, ease: "power2.out" }, 0.46)
            .fromTo(rule, { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.26, ease: "power2.out" }, 0.58)
            .fromTo(button, { scale: 0.92, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.34, ease: "power3.out" }, 0.48)
            .fromTo(cursor, { x: 34, y: -28, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, 0.76)
            .to(cursor, { scale: 0.84, duration: 0.08, ease: "power1.in" }, 1.46)
            .to(cursor, { scale: 1, duration: 0.12, ease: "power1.out" }, 1.55)
            .fromTo(clickRing, { scale: 0.48, opacity: 0 }, { scale: 1.1, opacity: 0.88, duration: 0.22, ease: "power2.out" }, 1.46)
            .to(clickRing, { scale: 1.4, opacity: 0, duration: 0.26, ease: "power1.out" }, 1.68)
            .to(followLabel, { y: -18, opacity: 0, duration: 0.18, ease: "power2.in" }, 1.48)
            .fromTo(followingLabel, { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.22, ease: "power2.out" }, 1.56)
            .to(button, { backgroundColor: "#4A7691", duration: 0.2, ease: "power1.out" }, 1.52);

          window.__timelines = window.__timelines || {};
          window.__timelines["maria-follow-profile-cta"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
