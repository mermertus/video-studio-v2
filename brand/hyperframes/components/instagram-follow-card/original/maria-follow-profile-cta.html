<!doctype html>
<html lang="es">
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Source Serif 4";
          src: url("assets/fonts/source-serif-4-600.ttf") format("truetype");
          font-weight: 600;
        }
        @font-face {
          font-family: "Work Sans";
          src: url("assets/fonts/work-sans-700.ttf") format("truetype");
          font-weight: 700;
        }
        @font-face {
          font-family: "Work Sans";
          src: url("assets/fonts/work-sans-800.ttf") format("truetype");
          font-weight: 800;
        }
        @font-face {
          font-family: "IBM Plex Mono";
          src: url("assets/fonts/ibm-plex-mono-600.ttf") format("truetype");
          font-weight: 600;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Work Sans", sans-serif;
        }

        .profile-card {
          position: absolute;
          left: 60px;
          right: 60px;
          bottom: 408px;
          height: 326px;
          display: grid;
          grid-template-columns: 180px 1fr 280px;
          gap: 28px;
          align-items: center;
          padding: 34px 42px;
          border: 2px solid rgba(150, 191, 212, 0.9);
          border-radius: 38px;
          background:
            radial-gradient(circle at 94% 18%, rgba(201, 225, 234, 0.95), transparent 36%),
            #fdfbf8;
          box-shadow: 0 22px 58px rgba(36, 30, 27, 0.2);
        }

        .profile-card::before {
          position: absolute;
          top: 30px;
          left: 42px;
          width: 166px;
          height: 5px;
          border-radius: 999px;
          background: #96bfd4;
          content: "";
        }

        .avatar {
          width: 168px;
          height: 168px;
          border: 5px solid #fdfbf8;
          border-radius: 50%;
          background-image: url("assets/maria-profile-reference.png");
          background-position: -120px -30px;
          background-repeat: no-repeat;
          background-size: 770px 235px;
          box-shadow: 0 0 0 2px #96bfd4;
        }

        .profile-copy {
          min-width: 0;
          padding-top: 22px;
        }

        .handle {
          margin: 0 0 12px;
          color: #4a7691;
          font-family: "IBM Plex Mono", monospace;
          font-size: 23px;
          font-weight: 600;
          letter-spacing: 0.05em;
        }

        .name {
          margin: 0;
          color: #241e1b;
          font-family: "Source Serif 4", serif;
          font-size: 56px;
          font-weight: 600;
          line-height: 0.96;
        }

        .profile-rule {
          width: 126px;
          height: 3px;
          margin-top: 20px;
          border-radius: 999px;
          background: #5c1a2c;
        }

        .follow-action {
          position: relative;
          display: grid;
          min-height: 172px;
          place-items: center;
        }

        .follow-button {
          position: relative;
          z-index: 2;
          display: grid;
          width: 238px;
          height: 100px;
          place-items: center;
          border-radius: 999px;
          background: #5c1a2c;
          color: #ffffff;
          font-size: 31px;
          font-weight: 800;
          letter-spacing: 0.03em;
          text-transform: uppercase;
        }

        .cursor {
          position: absolute;
          right: -2px;
          bottom: 0;
          z-index: 4;
          width: 76px;
          height: 90px;
          filter: drop-shadow(0 5px 0 rgba(36, 30, 27, 0.16));
        }

        .click-ring {
          position: absolute;
          right: 16px;
          bottom: 18px;
          z-index: 1;
          width: 86px;
          height: 86px;
          border: 4px solid #96bfd4;
          border-radius: 50%;
        }
      </style>

      <div id="root" data-composition-id="maria-follow-profile-cta" data-width="1080" data-height="1920" data-duration="2.8">

          <div class="avatar" aria-label="Perfil de María Bejarano"></div>

            <p class="handle">by.mariabejarano</p>

            <div class="profile-rule"></div>
          </div>
          <div class="follow-action">
            <div class="click-ring"></div>
            <div class="follow-button">SÍGUEME</div>
            <svg class="cursor" viewBox="0 0 76 90" aria-hidden="true">
              <path d="M8 5 66 53 43 57 56 82 42 88 29 61 14 78Z" fill="#FDFBF8" stroke="#241E1B" stroke-linejoin="round" stroke-width="5" />
            </svg>
          </div>
        </div>
      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(".profile-card", { y: 54, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.08)
            .fromTo(".avatar", { scale: 0.82, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.4)" }, 0.2)

            .fromTo(".follow-button", { scale: 0.82, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.36, ease: "back.out(1.5)" }, 0.46)

            .fromTo(".click-ring", { scale: 0.52, opacity: 0 }, { scale: 1.08, opacity: 0.8, duration: 0.26, ease: "power2.out" }, 0.72)
            .to(".click-ring", { scale: 1.34, opacity: 0, duration: 0.28, ease: "power1.out" }, 0.98);
          window.__timelines = window.__timelines || {};
          window.__timelines["maria-follow-profile-cta"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
