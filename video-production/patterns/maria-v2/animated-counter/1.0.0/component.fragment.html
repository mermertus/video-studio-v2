<div class="clip maria-v2-counter"
  data-start="{{START}}" data-duration="{{DURATION}}" data-track-index="{{TRACK}}"
  data-counter-from="{{FROM}}" data-counter-to="{{TO}}" data-counter-source="{{SOURCE}}">
  <strong data-counter-value>{{TO}}</strong><span>{{SUFFIX}}</span>
</div>
<!-- Animate a plain numeric object on a paused registered timeline; end on TO. -->
